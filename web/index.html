<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KASUGAI Canvas</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.165.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main class="workspace">
      <section class="panel deck-panel">
        <div id="deck-container" class="viewport">
          <aside class="control-panel">
            <nav class="panel-tabs" aria-label="Plugin panels">
              <button id="layer-panel-toggle" class="panel-toggle" type="button" aria-label="最小化">−</button>
              <button class="panel-tab active" type="button" data-panel="layers-panel">Layers</button>
              <button class="panel-tab" type="button" data-panel="camera-panel">Camera</button>
              <button class="panel-tab" type="button" data-panel="search-panel">Search</button>
              <button class="panel-tab" type="button" data-panel="share-panel">Share</button>
              <button class="panel-tab" type="button" data-panel="info-panel">Info</button>
              <button class="panel-tab" type="button" data-panel="legend-panel">凡例</button>
              <button class="panel-tab" type="button" data-panel="attr-panel">Attr</button>
              <button class="panel-tab" type="button" data-panel="settings-panel">設定</button>
            </nav>
            <section id="layers-panel" class="plugin-panel active">
              <div id="layer-list"></div>
            </section>
            <section id="camera-panel" class="plugin-panel">
              <div class="section-title">Camera presets</div>
              <div id="camera-presets"></div>
              <div class="camera-grid">
                <input id="camera-longitude" type="number" step="any" aria-label="Longitude" />
                <input id="camera-latitude" type="number" step="any" aria-label="Latitude" />
                <input id="camera-zoom" type="number" step="any" aria-label="Zoom" />
                <input id="camera-pitch" type="number" step="any" aria-label="Pitch" />
                <input id="camera-bearing" type="number" step="any" aria-label="Bearing" />
              </div>
              <button id="apply-camera" type="button">Apply camera</button>
            </section>
            <section id="search-panel" class="plugin-panel">
              <div id="search-title" class="section-title">Search（国土地理院住所検索API）</div>
              <form id="search-form">
                <input id="search-query" placeholder="住所・施設名" required />
                <button type="submit">検索</button>
              </form>
              <div id="search-results" class="search-results"></div>
            </section>
            <section id="share-panel" class="plugin-panel">
              <div class="section-title">Share</div>
              <button id="copy-share-url" type="button">現在位置URLをコピー</button>
              <input id="share-url" class="share-url" readonly />
            </section>
            <section id="settings-panel" class="plugin-panel terrain-control">
              <nav class="settings-tabs" aria-label="設定カテゴリ">
                <button class="settings-tab active" type="button" data-settings-panel="settings-dem-panel">DEM</button>
                <button class="settings-tab" type="button" data-settings-panel="settings-project-panel">Project</button>
                <button class="settings-tab" type="button" data-settings-panel="settings-layer-panel">レイヤ</button>
                <button class="settings-tab" type="button" data-settings-panel="settings-other-panel">その他</button>
              </nav>
              <section id="settings-dem-panel" class="settings-subpanel active">
                <p class="hint terrain-definition"><strong>DEMテクスチャー</strong>：DEMで作った地形メッシュにBase map画像を貼る表示。<br /><strong>ドレープ</strong>：XYZ・GeoJSONなどのレイヤーを地形表面の起伏に沿わせて貼る表示。</p>
                <div class="terrain-options">
                  <label><input id="terrain-toggle" type="checkbox" checked /> Terrain (DEM表示)</label>
                  <label><input id="basemap-drape-3dtiles" type="checkbox" /> 3D Tiles (BASEMAPドレープ)</label>
                </div>
                <label class="field-label" for="dem-source">DEM</label>
                <select id="dem-source">
                  <option value="reearth-ellipsoid" selected>Re:Earth Terrain (楕円体高 / WGS84, zoom 19)</option>
                  <option value="reearth">Re:Earth Terrain (標高 / MSL, zoom 19)</option>
                  <option value="terrarium">Terrarium DEM (AWS, zoom 15)</option>
                </select>
              </section>
              <section id="settings-project-panel" class="settings-subpanel">
                <label class="field-label" for="project-select">Project</label>
                <select id="project-select" aria-label="Project"></select>
              </section>
              <section id="settings-layer-panel" class="settings-subpanel">
                <span class="field-label">ドレープ対象地形</span>
                <label><input id="drape-terrain-dem" type="checkbox" checked /> DEM</label>
                <label><input id="drape-terrain-tiles3d" type="checkbox" checked /> 3D Tiles</label>
                <span class="field-label">ドレープを適用するレイヤー</span>
                <label><input id="drape-xyz" type="checkbox" checked /> XYZ</label>
                <label><input id="drape-geojson" type="checkbox" checked /> GeoJSON</label>
                <div class="section-title inspector-title">インスペクター</div>
                <textarea id="inspector-input" class="inspector-input" spellcheck="false"></textarea>
                <button id="apply-inspector" type="button">登録</button>
                <p id="inspector-status" class="hint" aria-live="polite"></p>
              </section>
              <section id="settings-other-panel" class="settings-subpanel">
                <div class="terrain-options">
                  <label><input id="shadow-toggle" type="checkbox" /> Shadow</label>
                </div>
                <div class="section-title">ポート番号</div>
                <label class="field-label" for="current-port">現在の接続ポート</label>
                <input id="current-port" type="number" min="1" max="65535" readonly />
                <p class="hint">ポート番号の変更は、アプリ起動時の設定で行います。</p>
                <div class="section-title">バージョン・更新</div>
                <p class="hint">現在のバージョン: <code id="current-version">-</code></p>
                <p class="hint">最新バージョン: <code id="latest-version">-</code> <span id="update-status"></span></p>
                <div class="terrain-options">
                  <label><input id="auto-update" type="checkbox" checked /> 起動時に自動更新</label>
                </div>
                <button id="check-update" type="button">更新を確認</button>
                <button id="install-update" type="button" hidden>最新版をインストール</button>
                <button id="shutdown-app" type="button" class="danger-button">停止</button>
                <p id="version-status" class="hint" aria-live="polite"></p>
              </section>
            </section>
            <section id="info-panel" class="plugin-panel embedded-content">
              <div id="info-content" class="info-content"></div>
            </section>
            <section id="legend-panel" class="plugin-panel embedded-content">
              <img alt="凡例" />
            </section>
            <section id="attr-panel" class="plugin-panel">
              <div class="section-title">Attr</div>
              <pre id="attr-content" class="attr-content">地物を選択すると属性を表示します。</pre>
            </section>
          </aside>
          <div class="basemap-control">
            <button id="basemap-toggle" class="basemap-toggle" type="button" aria-label="最小化">−</button>
            <select id="basemap-select"></select>
          </div>
          <aside class="navigation-toolbar" aria-label="Navigation toolbar">
            <button id="compass-button" class="compass-button" type="button" title="Reset north">
              <span class="compass-needle"></span><strong>N</strong>
            </button>
            <button id="top-down-button" type="button">2D</button>
            <button id="navigation-toggle" class="navigation-toggle" type="button" aria-label="最小化">−</button>
          </aside>
          <small id="map-attribution" class="map-attribution"></small>
        </div>
      </section>
    </main>
    <script type="module" src="/bootstrap.js"></script>
  </body>
</html>
