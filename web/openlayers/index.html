<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KASUGAI Canvas — OpenLayers</title>
<link rel="icon" type="image/x-icon" href="../favicon.ico" />
<script type="importmap">
{
  "imports": {
    "rbush": "https://cdn.jsdelivr.net/npm/rbush@4.0.1/+esm",
    "earcut": "https://cdn.jsdelivr.net/npm/earcut@3.2.4/+esm",
    "pbf": "https://cdn.jsdelivr.net/npm/pbf@5.1.2/+esm",
    "geotiff": "https://cdn.jsdelivr.net/npm/geotiff@3.1.0-beta.0/+esm",
    "zarrita": "https://cdn.jsdelivr.net/npm/zarrita@0.7.5/+esm"
  }
}
</script>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, "Segoe UI", "Yu Gothic", sans-serif; }
  #map { position: absolute; inset: 0; background: #20262b; }
  #panel {
    position: absolute; top: 10px; left: 10px; z-index: 10;
    background: rgba(255,255,255,.94); border-radius: 8px; padding: 10px 12px;
    width: 320px; max-height: 80vh; display: flex; flex-direction: column;
    box-shadow: 0 2px 8px rgba(0,0,0,.3); font-size: 13px;
  }
  #panel h1 { display: flex; align-items: center; gap: 6px; font-size: 14px; margin: 0 0 6px; }
  #panel h1 .panel-title-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* プロジェクト選択行: 左=プロジェクトセレクト、右=機能ボタン(リンクコピー・印刷)。
     ボタンは行の高さ(=セレクトの高さ)いっぱいに伸ばして正方形に揃える */
  .project-row { display: flex; gap: 4px; height: 30px; margin-bottom: 8px; }
  .project-row > #project-select { flex: 1; min-width: 0; margin-bottom: 0; }
  .project-row > button { flex: 0 0 30px; padding: 0; border: 1px solid #ccc; border-radius: 4px; background: #f4f6f8; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; }
  .project-row > #print-open { padding: 4px; }
  .project-row > #print-open > svg { width: 100%; height: 100%; display: block; }
  #panel select, #panel input[type="text"] { width: 100%; box-sizing: border-box; margin-bottom: 8px; }
  #tabs { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
  #tabs .tab { flex: 1; min-width: 44px; padding: 4px 0; font-size: 12px; border: 1px solid #ccc;
               border-radius: 4px; background: #f4f6f8; cursor: pointer; }
  #tabs .tab.active { background: #2c5ea8; color: #fff; border-color: #2c5ea8; }
  .tab-pane { overflow: auto; flex: 1; min-height: 0; }
  /* パネル最小化（Cesium 版 .control-panel.collapsed と同型: 40x40 に縮めてトグルのみ残す） */
  #panel-toggle { flex: 0 0 26px; min-width: 26px; min-height: 26px; padding: 1px 4px;
    border: 0; border-radius: 4px; background: rgba(44,94,168,.12); color: #2c5ea8;
    font-size: 18px; line-height: 1; cursor: pointer; }
  #panel.collapsed { width: 40px; height: 40px; padding: 7px; box-sizing: border-box; overflow: hidden; }
  #panel.collapsed > *:not(h1) { display: none; }
  #panel.collapsed h1 { margin: 0; gap: 0; }
  #panel.collapsed h1 > *:not(#panel-toggle) { display: none; }
  .layer-row { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
  .layer-row input { margin: 0; }
  .layer-row span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .layer-item { min-width: 0; }
  .layer-group-title { display: flex; align-items: center; gap: 4px; padding: 2px 0; font-weight: 600; }
  .layer-group-title input { margin: 0; }
  .layer-group-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .layer-group-toggle, .layer-legend-toggle, .layer-focus {
    border: none; background: none; cursor: pointer; padding: 0 2px; font-size: 11px; flex: none; }
  .layer-group-children { margin-left: 14px; }
  .exclusive-badge { color: #888; font-weight: 400; font-size: 10px; margin-left: 2px; }
  .layer-legend-items { margin-left: 22px; }
  .legend-row { display: flex; align-items: center; gap: 5px; padding: 1px 0; font-size: 11px; }
  .legend-row input { margin: 0; }
  .legend-swatch { width: 16px; height: 16px; object-fit: contain; flex: none; }
  .legend-row .legend-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .basemap-control { position: absolute; left: 12px; bottom: 12px; z-index: 1004; display: flex;
    align-items: center; gap: 6px; padding: 6px 8px; border: 1px solid rgba(14,32,64,.15);
    border-radius: 7px; background: rgba(255,255,255,.9); box-shadow: 0 2px 8px rgba(10,20,40,.15); }
  .basemap-control select { min-width: 160px; max-width: 60vw; padding: 4px 6px;
    border: 1px solid #cbd9de; border-radius: 4px; background: #fff; font-size: 13px; }
  .basemap-control.collapsed { padding: 4px; }
  .basemap-control.collapsed select { display: none; }
  .basemap-control.collapsed .basemap-list { display: none; }
  .basemap-control.collapsed #basemap-globe { display: none; }
  /* ベースマップのグループ化表示(select optgroup を折りたたみ可能なリストへ置き換え) */
  .basemap-control .basemap-list { min-width: 160px; max-width: 60vw; max-height: 45vh; overflow-y: auto; font-size: 13px; }
  .basemap-control .basemap-item { padding: 3px 6px; border-radius: 4px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .basemap-control .basemap-item:hover { background: rgba(44,94,168,.12); }
  .basemap-control .basemap-item.selected { background: rgba(44,94,168,.2); font-weight: 600; }
  .basemap-control .basemap-group-head { display: flex; align-items: center; gap: 4px; padding: 2px 4px; font-weight: 600; color: #2c5ea8; cursor: pointer; user-select: none; }
  .basemap-control .basemap-group-toggle { font-size: 10px; }
  .basemap-control .basemap-group-items .basemap-item { padding-left: 18px; }
  .basemap-control .basemap-list-tools { display: flex; gap: 4px; padding: 0 0 4px; border-bottom: 1px solid rgba(44,94,168,.18); margin-bottom: 3px; }
  .basemap-control .basemap-tool { padding: 1px 7px; border: 1px solid rgba(44,94,168,.4); border-radius: 4px; background: #fff; color: #2c5ea8; cursor: pointer; font-size: 11px; line-height: 1.6; }
  .basemap-control .basemap-tool:hover { background: rgba(44,94,168,.12); }
  #basemap-toggle, #basemap-globe { width: 22px; height: 22px; border: 0; border-radius: 4px;
    background: rgba(44,94,168,.12); color: #2c5ea8; cursor: pointer; font-size: 14px; line-height: 1; }
  .map-attribution { position: absolute; right: 8px; bottom: 6px; z-index: 1004; max-width: 60%;
    padding: 3px 5px; color: #52636d; background: rgba(255,255,255,.8); font-size: 10px;
    border-radius: 4px; }
  .map-attribution a { color: #2c5ea8; }
  .ol-scale-line.kasc-scale { bottom: 46px; left: 50%; transform: translateX(-50%); }
  .ol-mouse-position.map-coords { position: absolute; left: 50%; bottom: 26px; top: auto; right: auto; transform: translateX(-50%);
    z-index: 1004; padding: 2px 5px; color: #52636d; background: rgba(255,255,255,.8);
    font-size: 10px; border-radius: 4px; font-family: monospace; pointer-events: none; }
  #settings-window { position: absolute; top: 60px; left: 360px; z-index: 1006; width: 300px;
    max-height: 75vh; overflow: auto; background: rgba(255,255,255,.95); border: 1px solid #ccc;
    border-radius: 8px; padding: 10px 12px; box-shadow: 0 4px 16px rgba(0,0,0,.25); font-size: 13px; }
  #settings-window .settings-head { display: flex; justify-content: space-between; align-items: center;
    font-weight: 600; margin-bottom: 8px; }
  #settings-window .settings-head button { border: none; background: none; cursor: pointer; font-size: 16px; }
  #settings-tabs { display: flex; gap: 4px; margin-bottom: 8px; }
  #settings-tabs .tab { flex: 1; padding: 4px 0; font-size: 12px; border: 1px solid #ccc;
                        border-radius: 4px; background: #f4f6f8; cursor: pointer; }
  #settings-tabs .tab.active { background: #2c5ea8; color: #fff; border-color: #2c5ea8; }
  #settings-window .set-row { display: block; font-size: 12px; margin: 8px 0; }
  #settings-window .set-row input[type=range] { width: 100%; }
  .inspector-input { width: 100%; box-sizing: border-box; height: 150px; font-family: monospace;
                     font-size: 11px; border: 1px solid #ccc; border-radius: 4px; }
  .note { color: #666; font-size: 11px; margin-top: 6px; }
  .cam-btn { display: inline-block; margin: 2px 4px 2px 0; padding: 2px 6px; font-size: 11px;
             border: 1px solid #bbb; border-radius: 4px; background: #f4f6f8; cursor: pointer; }
  .cam-btn.bm-btn { background: #eef3fb; border-color: #9fb8dd; }
  .cam-group-label { display: flex; align-items: center; gap: 6px; width: 100%; font-size: 12px;
                     font-weight: 600; color: #444; margin: 8px 0 4px; padding-bottom: 3px;
                     border-bottom: 1px solid #d5dde4; }
  .cam-group-label button { padding: 1px 8px; font-size: 11px; font-weight: 400; border: 1px solid #bbb;
                            border-radius: 3px; background: #fff; color: #444; cursor: pointer; }
  #engines { margin-top: 8px; font-size: 11px; flex: none; }
  #engines a { margin-right: 6px; }
  /* ナビゲーションツールバー（Cesium 版 .navigation-toolbar と同型の右上配置） */
  .navigation-toolbar { position: absolute; z-index: 1004; top: 14px; right: 14px;
    display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 7px 5px;
    border: 1px solid rgba(14,32,64,.12); border-radius: 10px;
    background: rgba(255,255,255,.6); box-shadow: 0 8px 18px rgba(10,20,40,.16); }
  .navigation-toolbar button { min-width: 42px; min-height: 29px; padding: 5px 7px;
    border: 1px solid rgba(0,0,0,.08); border-radius: 7px;
    background: linear-gradient(#fff, #f1f4f8); color: #263643; cursor: pointer; font-size: 13px; }
  .navigation-toolbar button:hover { background: #e7f3f0; }
  .navigation-toolbar.collapsed button:not(.navigation-toggle) { display: none; }
  .navigation-toolbar.collapsed { width: 40px; height: 40px; padding: 7px; box-sizing: border-box; gap: 0; }
  .navigation-toolbar.collapsed .navigation-toggle { width: 26px; min-width: 26px; min-height: 26px; padding: 1px 4px; }
  .navigation-toggle { font-size: 17px !important; line-height: 1; }
  .compass-button { position: relative; width: 64px; height: 64px; min-width: 64px !important;
    min-height: 64px !important; border-radius: 50% !important; transition: transform 180ms ease; }
  .compass-button strong { position: absolute; left: 50%; top: 15px; transform: translateX(-50%);
    color: #222; font-size: 19px; }
  .compass-needle { position: absolute; left: 50%; top: 50%; width: 0; height: 0;
    border-left: 7px solid transparent; border-right: 7px solid transparent;
    border-bottom: 27px solid #e33d3d; transform: translate(-7px, -27px); transform-origin: 7px 27px; }
  .compass-needle::after { content: ""; position: absolute; left: 0; top: 27px;
    border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 27px solid #a82020; }
  /* ホバーヒント(コンパスは transform で回転するため、針と別の .nav-item ラッパーに置く) */
  .navigation-toolbar .nav-item { position: relative; display: flex; }
  .navigation-toolbar .nav-hint { position: absolute; right: calc(100% + 8px); top: 50%;
    transform: translateY(-50%); padding: 4px 8px; border-radius: 6px;
    background: rgba(20,30,40,.85); color: #fff; font-size: 11px; white-space: nowrap;
    pointer-events: none; opacity: 0; transition: opacity .15s; }
  .navigation-toolbar .nav-item:hover .nav-hint,
  .navigation-toolbar .nav-item:focus-within .nav-hint { opacity: 1; }
  #legends img { max-width: 100%; max-height: 200px; object-fit: contain; display: block; margin: 4px 0; }
  /* info: 埋め込みHTML内のサブタブ(.tab-button/.tab-content)と画像 */
  #info-link .tab-buttons { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 4px; }
  #info-link .tab-button { min-height: 26px; padding: 4px 7px; border: 0; border-radius: 4px 4px 0 0; background: transparent; color: #52636d; cursor: pointer; font-size: 12px; }
  #info-link .tab-button.active { background: rgba(44,94,168,.16); color: #2c5ea8; font-weight: 700; }
  #info-link .tab-content { display: none; }
  #info-link .tab-content.active { display: block; }
  #info-link img { max-width: 100%; height: auto; }
  
  /* 地図上部の読込進捗ピル(レイヤの段階読み込み状況) */
  #load-progress { position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    z-index: 1005; display: flex; align-items: center; gap: 8px; padding: 5px 12px;
    background: rgba(255,255,255,.95); border-radius: 14px; font-size: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.25); max-width: 70vw; }
  #load-progress[hidden] { display: none; }
  #load-progress-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #load-progress-track { width: 110px; height: 4px; background: #dde4ea; border-radius: 2px;
    overflow: hidden; flex: none; }
  #load-progress-bar { display: block; height: 100%; width: 0; background: #2c5ea8;
    transition: width .25s; }
  /* レイヤ行の読込ステータス(スピナー/未読込/失敗) */
  .layer-row > .layer-status { flex: none; font-size: 10px; color: #8a97a3; }
  .layer-status.loading { width: 11px; height: 11px; border: 2px solid #d5dde4;
    border-top-color: #2c5ea8; border-radius: 50%; animation: layer-spin .8s linear infinite; }
  .layer-status.failed { color: #c0392b; }
  @keyframes layer-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="map"><small id="map-attribution" class="map-attribution"></small><div id="load-progress" hidden><span id="load-progress-text"></span><span id="load-progress-track"><i id="load-progress-bar"></i></span></div><aside class="navigation-toolbar" aria-label="ナビゲーション">
  <span class="nav-item"><button id="nav-compass" class="compass-button" type="button" title="北をリセット" aria-label="北をリセット"><span class="compass-needle"></span><strong>N</strong></button><span class="nav-hint" role="tooltip">Alt+Shift+ドラッグで回転</span></span>
  <button id="nav-home" type="button" title="全体表示（データ範囲へフィット）" aria-label="全体表示">⌂</button>
  <button id="navigation-toggle" class="navigation-toggle" type="button" title="最小化" aria-label="最小化">−</button>
</aside></div>
<div id="settings-window" hidden>
  <div class="settings-head"><span>設定</span><button id="settings-close" type="button" title="閉じる">×</button></div>
  <div id="settings-tabs">
    <button class="tab active" data-settab="display" type="button">表示</button>
    <button class="tab" data-settab="inspector" type="button">インスペクター</button>
    <button class="tab" data-settab="ai" type="button">AI</button>
  </div>
  <div class="set-pane" id="setpane-display">
    <label class="set-row">ベースマップ透過度
      <input id="display-opacity" type="range" min="0" max="1" step="0.05" value="1" /></label>
    <label class="set-row">回転（度）
      <input id="display-rotation" type="number" step="1" value="0" style="width:80px" /></label>
    <label class="set-row"><input id="display-north" type="checkbox" /> 北を上に固定</label>
    <label class="set-row">レイヤー透過度
      <input id="display-layer-opacity" type="range" min="0" max="1" step="0.05" value="1" /></label>
    <label class="set-row"><input id="display-scalebar" type="checkbox" checked /> スケールバーを表示</label>
    <label class="set-row"><input id="display-coords" type="checkbox" checked /> カーソル座標を表示</label>
    <div class="set-row" style="font-weight:600;">3D Tiles ドレープ（deck.gl）</div>
    <label class="set-row"><input id="drape-tiles3d" type="checkbox" checked /> レイヤーを 3D Tiles 表面へドレープ</label>
    <div style="margin-left:20px;">
      <label class="set-row"><input id="drape-tiles3d-basemap" type="checkbox" checked /> ベースマップ</label>
      <label class="set-row"><input id="drape-tiles3d-xyz" type="checkbox" checked /> XYZ レイヤー</label>
      <label class="set-row"><input id="drape-tiles3d-vector" type="checkbox" checked /> ベクターレイヤー</label>
    </div>
  </div>
  <div class="set-pane" id="setpane-inspector" hidden>
    <textarea id="inspector-input" class="inspector-input" spellcheck="false"></textarea>
    <div style="display:flex;gap:6px;margin-top:6px;">
      <button id="apply-inspector" type="button" style="flex:1;padding:5px;border:1px solid #4682b4;background:#4682b4;color:#fff;border-radius:4px;cursor:pointer;">登録</button>
      <button id="export-inspector" type="button" style="flex:1;padding:5px;border:1px solid #666;background:#fff;border-radius:4px;cursor:pointer;">エクスポート(.kasc)</button>
    </div>
    <p id="inspector-status" class="note" aria-live="polite"></p>
    <div style="font-weight:600;margin-top:8px;font-size:12px;">ファイル保存先</div>
    <label class="field-label" for="inspector-data-dir" style="display:block;font-size:11px;color:#666;margin:4px 0;">保存先フォルダ (DATA/ を選択)</label>
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;">
      <button id="inspector-data-dir" type="button" style="flex:0 0 auto;">フォルダを選択</button>
      <span id="inspector-data-dir-name" style="font-size:0.85em;color:#71818d;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">未選択</span>
    </div>
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;">
      <input id="inspector-add-file" type="file" multiple style="display:none;" />
      <button id="inspector-add-file-button" type="button" style="flex:0 0 auto;">DATA/ に保存して追加</button>
    </div>
    <p class="note">選択したファイルを DATA/ へ保存し（ローカルサーバー版はサーバー側、それ以外は上で選択したフォルダ）、対応形式なら設定行を追記して即時反映します。対応: .geojson .json .gpkg .fgb .parquet</p>
  </div>
<div class="set-pane" id="setpane-ai" hidden></div>
</div>
<div id="panel">
  <h1><button id="panel-toggle" type="button" title="最小化" aria-label="最小化">−</button><span class="panel-title-text">KASUGAI Canvas <small>OpenLayers</small></span><span>
    <button id="settings-open" type="button" title="設定" style="border:none;background:none;cursor:pointer;font-size:14px">⚙</button>
    <a id="help-open" href="https://yamamoto-ryuzo.github.io/kasugai_canvas/" target="_blank" rel="noopener noreferrer" title="ヘルプ" style="text-decoration:none;color:inherit;font-size:14px">?</a>
  </span></h1>
  <div class="project-row">
    <select id="project-select"></select>
    <button id="share-copy" type="button" title="現在位置URLをコピー">🔗</button>
    <button id="print-open" type="button" title="印刷" aria-label="印刷"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2.5 8a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1"/><path d="M5 1a2 2 0 0 0-2 2v2H2a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h1v1a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-1h1a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-1V3a2 2 0 0 0-2-2zM4 3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2H4zm1 5a2 2 0 0 0-2 2v1H2a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v-1a2 2 0 0 0-2-2zm7 2v3a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1"/></svg></button>
  </div>
  <div id="tabs">
    <button class="tab active" data-tab="layers">レイヤ</button>
    <button class="tab" data-tab="legend">凡例</button>
    <button class="tab" data-tab="search">検索</button>
    <button class="tab" data-tab="attr">属性</button>
    <button class="tab" data-tab="camera">カメラ</button>
    <button class="tab" data-tab="info">情報</button>
  </div>
  <div class="tab-pane" id="pane-layers">
    <select id="theme-select" hidden style="width:100%;margin-bottom:6px;"></select>
    <div id="layers"></div>
  </div>
  <div class="tab-pane" id="pane-legend" hidden>
    <div id="legends"></div>
  </div>
  <div class="tab-pane" id="pane-search" hidden>
    <input id="search-input" type="text" placeholder="文字で検索" />
    <div id="search-results"></div>
  </div>
  <div class="tab-pane" id="pane-attr" hidden>
    <button id="attr-widget-open" type="button" style="width:100%;margin-bottom:6px;padding:4px;border:1px solid #ccc;border-radius:4px;background:#f4f6f8;cursor:pointer;">選択中のレイヤ属性一覧</button>
    <div id="attr-content">地物を選択すると属性を表示します。</div>
  </div>
  <div class="tab-pane" id="pane-camera" hidden>
    <div id="cams"></div>
    <div class="cams-io">
      <input id="cams-import-file" type="file" accept=".xml" hidden>
      <input id="cams-import-cam-file" type="file" accept=".txt,.kasc" hidden>
    </div>
  </div>
  <div class="tab-pane" id="pane-info" hidden>
    <div id="info-link"></div>
    <div id="unsupported" class="note"></div>
  </div>
  <div id="engines"></div>
</div>
<script>
  window.switchPanelTab = name => {
    document.querySelectorAll("#tabs .tab").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
    document.querySelectorAll(".tab-pane").forEach(p => { p.hidden = p.id !== `pane-${name}`; });
  };
  for (const btn of document.querySelectorAll("#tabs .tab")) {
    btn.addEventListener("click", () => switchPanelTab(btn.dataset.tab));
  }
  document.querySelector("#settings-open").addEventListener("click", () => {
    const w = document.querySelector("#settings-window");
    w.hidden = !w.hidden;
  });
  for (const btn of document.querySelectorAll("#settings-tabs .tab")) {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#settings-tabs .tab").forEach(b => b.classList.toggle("active", b === btn));
      document.querySelectorAll(".set-pane").forEach(p => { p.hidden = p.id !== `setpane-${btn.dataset.settab}`; });
    });
  }
  document.querySelector("#settings-close").addEventListener("click", () => {
    document.querySelector("#settings-window").hidden = true;
  });
  document.querySelector("#share-copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(location.href); } catch (e) {}
  });
  document.querySelector("#panel-toggle").addEventListener("click", e => {
    const collapsed = document.querySelector("#panel").classList.toggle("collapsed");
    e.currentTarget.textContent = collapsed ? "+" : "−";
    e.currentTarget.setAttribute("aria-label", collapsed ? "展開" : "最小化");
    e.currentTarget.title = collapsed ? "展開" : "最小化";
  });
</script>
<div id="basemap-ctl" class="basemap-control" hidden>
  <button id="basemap-toggle" type="button" aria-label="最小化">−</button>
  <button id="basemap-globe" type="button" title="Google Earth で現在の表示を開く" aria-label="Google Earth で現在の表示を開く">🌐</button>
  <select id="basemap-select"></select>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
