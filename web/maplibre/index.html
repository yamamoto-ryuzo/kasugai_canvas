<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KASUGAI Canvas — MapLibre</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js" crossorigin="anonymous"></script>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" crossorigin="anonymous" />
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, "Segoe UI", "Yu Gothic", sans-serif; }
  #map { position: absolute; inset: 0; background: #20262b; }
  #panel {
    position: absolute; top: 10px; left: 10px; z-index: 10;
    background: rgba(255,255,255,.94); border-radius: 8px; padding: 10px 12px;
    max-width: 320px; max-height: 80vh; overflow: auto; box-shadow: 0 2px 8px rgba(0,0,0,.3);
    font-size: 13px;
  }
  #panel h1 { font-size: 14px; margin: 0 0 6px; }
  #panel select { width: 100%; margin-bottom: 8px; }
  .layer-row { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
  .layer-row input { margin: 0; }
  .note { color: #666; font-size: 11px; margin-top: 6px; }
  #engines { margin-top: 8px; font-size: 11px; }
  #engines a { margin-right: 6px; }
  .cam-btn { display: inline-block; margin: 2px 4px 2px 0; padding: 2px 6px; font-size: 11px;
             border: 1px solid #bbb; border-radius: 4px; background: #f4f6f8; cursor: pointer; }
  .maplibregl-popup-content { max-height: 240px; overflow: auto; font-size: 12px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>KASUGAI Canvas <small>MapLibre</small></h1>
  <select id="project-select"></select>
  <div id="layers"></div>
  <div id="unsupported" class="note"></div>
  <div id="engines">
    engine: <a href="/?engine=cesium">cesium</a><b>maplibre</b><a href="/?engine=openlayers">openlayers</a>
  </div>
</div>
<script src="/shared/kasc_loader.js"></script>
<script src="/shared/kasc_panel.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
