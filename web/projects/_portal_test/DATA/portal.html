<div style="padding:4px 0">
  <p style="margin:0 0 10px;font-size:15px"><b>カスタムポータル</b> — このページは DATA/portal.html で描画されています</p>
  <div style="display:flex;gap:10px;flex-wrap:wrap">
    <button data-view="工事中" style="padding:20px 26px;font-size:16px;border:2px solid #31564f;border-radius:8px;background:#eef5f3;cursor:pointer">工事中を表示</button>
    <button data-view="未発注" style="padding:20px 26px;font-size:16px;border:2px solid #31564f;border-radius:8px;cursor:pointer">未発注を表示</button>
    <button data-view="全体" style="padding:20px 26px;font-size:16px;border:2px solid #31564f;border-radius:8px;cursor:pointer">全体表示</button>
    <button data-link="https://www.city.kasugai.lg.jp/" style="padding:20px 26px;font-size:16px;border:2px solid #888;border-radius:8px;cursor:pointer">市役所サイト ↗</button>

</div>
