    <rect x="150" y="198" width="16" height="11" fill="#f569a9" opacity="0.7"/><text x="172" y="207">商業地域</text>
    <rect x="16" y="214" width="16" height="11" fill="#ce93ff" opacity="0.7"/><text x="38" y="223">準工業地域</text>
