[package]
name = "kasugai_canvas"
version = "6.0.0"
edition = "2021"
license = "MIT"
description = "KASUGAI Canvas CesiumJS and Three.js viewer"

[dependencies]
axum = "0.8"
opener = "0.7.2"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "sync", "time", "fs"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }

[build-dependencies]
winres = "0.1.12"
