[package]
name = "kasugai_canvas"
version = "0.4.0"
edition = "2021"
description = "KASUGAI Canvas deck.gl and Three.js viewer"

[dependencies]
axum = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "sync", "time", "fs"] }

[build-dependencies]
winres = "0.1.12"
