[package]
name = "kasugai_canvas"
version = "3.4.14"
edition = "2021"
description = "KASUGAI Canvas CesiumJS and Three.js viewer"

[dependencies]
axum = "0.8"
opener = "0.7.2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "sync", "time", "fs"] }
tower-http = { version = "0.6", features = ["fs"] }

[build-dependencies]
winres = "0.1.12"
